<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FocusFlow｜任務管理中心</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1e293b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9db8ff;outline-offset:2px}.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}.sidebar{background:#101a32;color:#d1d9ec;padding:30px 20px;display:flex;flex-direction:column;gap:28px}.brand{font-size:23px;font-weight:850;color:#fff;letter-spacing:-.7px}.brand span{display:inline-grid;place-items:center;background:#5c76f7;width:36px;height:36px;border-radius:12px;margin-right:8px}.side-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7d8ba8;font-weight:800;margin:0 10px 10px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b7c3dc;text-align:left;padding:12px 14px;border-radius:12px;font-weight:600}.nav button.active,.nav button:hover{background:#263657;color:#fff}.side-bottom{margin-top:auto;font-size:12px;color:#93a4c4;line-height:1.7;padding:12px}.main{max-width:1370px;width:100%;margin:auto;padding:40px 48px 70px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:12px;letter-spacing:2px;color:#687c9e;font-weight:800}.head h1{font-size:34px;letter-spacing:-1.5px;margin:8px 0}.sub{color:#8793a7;margin:0}.btn{border:1px solid #e2e7f0;border-radius:12px;background:white;color:#37445d;padding:11px 16px;font-weight:700}.btn:hover{filter:brightness(.97)}.primary{background:#536df1;color:#fff;border-color:#536df1;box-shadow:0 8px 18px #536df12b}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:30px 0}.stat{background:#fff;border:1px solid #e9edf5;border-radius:19px;padding:21px;box-shadow:0 8px 26px #24375d08}.stat .mini{font-size:12px;color:#8793a7;font-weight:700}.stat strong{font-size:31px;display:block;margin-top:10px;letter-spacing:-1px}.stat .accent{font-size:12px;color:#6d7e98;margin-top:6px}.stat.urgent{background:#fff8f7;border-color:#ffdfdc}.stat.urgent strong{color:#e45e5b}.content{background:white;border:1px solid #e9edf5;border-radius:22px;padding:26px;box-shadow:0 10px 35px #24375d08}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-head h2{font-size:20px;margin:0}.section-head p{font-size:13px;color:#8995a8;margin:6px 0 0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tools input,.tools select{border:1px solid #e2e7ef;border-radius:11px;padding:11px 12px;background:#fff;color:#41506a;min-width:0}.tools input{flex:1;min-width:160px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:0;background:#f2f5fa;color:#75849b;padding:9px 15px;border-radius:10px;font-weight:700}.tabs button.active{background:#e8edff;color:#4f65d6}.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:start;padding:19px 3px;border-bottom:1px solid #edf0f5}.task:last-child{border:0}.check{width:20px;height:20px;accent-color:#586ff0;margin-top:4px}.task-title{font-weight:750;font-size:15px;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:#9aa5b5}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}.pill{border-radius:7px;padding:5px 8px;font-size:11px;font-weight:800;background:#f1f4f9;color:#70819b}.p-urgent{background:#ffe8e6;color:#d94d4a}.p-high{background:#fff1de;color:#ba791b}.p-medium{background:#eaf0ff;color:#5271d9}.p-low{background:#e5f6ef;color:#2b9770}.overdue{color:#d94d4a;background:#fff0ef}.task-actions{display:flex;gap:5px}.iconbtn{background:transparent;border:0;color:#8794a8;padding:7px;border-radius:8px}.iconbtn:hover{background:#f2f5fb}.desc{color:#8290a6;font-size:13px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}.subtasks{margin-top:10px;display:grid;gap:5px}.subtasks label{font-size:12px;color:#78869b;display:flex;gap:6px;align-items:center}.subtasks input{accent-color:#536df1}.empty{text-align:center;padding:70px 10px;color:#8a98ad}.empty b{display:block;color:#44536c;margin:12px}.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.footer .btn{font-size:12px}.modal{position:fixed;inset:0;background:#101b32a3;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.open{display:flex}.dialog{background:#fff;width:min(550px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:28px;box-shadow:0 30px 90px #0811264d}.dialog h2{margin:0 0 20px}.field{display:grid;gap:7px;margin-bottom:15px;font-size:13px;color:#58667d;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe5ee;border-radius:11px;padding:12px;color:#2c3a50;background:#fff}.field textarea{resize:vertical;min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.progress{height:7px;background:#e8edf8;border-radius:20px;margin-top:12px;overflow:hidden}.progress>div{height:100%;background:#6077f4;transition:width .2s}.mobile-nav{display:none}@media(max-width:1000px){.app{grid-template-columns:190px minmax(0,1fr)}.main{padding:30px 24px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.sidebar{padding:15px 18px;gap:10px}.brand{font-size:20px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-label,.side-bottom{display:none}.main{padding:25px 15px}.head h1{font-size:27px}.head{align-items:flex-start}.head .btn{padding:10px;font-size:12px}.stats{gap:9px;margin:22px 0}.stat{padding:15px}.stat strong{font-size:26px}.content{padding:17px}.tools{gap:7px}.tools input{flex-basis:100%}.tools select{flex:1}.task{grid-template-columns:22px minmax(0,1fr);gap:10px}.task-actions{grid-column:2;justify-content:flex-end}.two{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span>✦</span>FocusFlow</div><div><div class="side-label">工作空間</div><nav class="nav" id="nav"><button data-view="all" class="active">▦　全部任務</button><button data-view="today">◷　今日到期</button><button data-view="urgent">⚑　緊急事項</button><button data-view="upcoming">▤　未來計畫</button><button data-view="done">✓　已完成</button></nav></div><div class="side-bottom">把每一件重要的小事<br>變成看得見的進度。<br>資料僅儲存在此瀏覽器。</div></aside><main class="main"><header class="head"><div><div class="eyebrow">YOUR PRODUCTIVITY DASHBOARD</div><h1>任務管理中心</h1><p class="sub" id="greeting">今天也一起把重要的事完成。</p></div><button class="btn primary" id="newTask">＋ 建立任務</button></header><section class="stats"><div class="stat"><div class="mini">全部任務</div><strong id="total">0</strong><div class="accent">已建立的所有事項</div></div><div class="stat"><div class="mini">待完成</div><strong id="pending">0</strong><div class="accent">尚待處理</div></div><div class="stat urgent"><div class="mini">緊急任務</div><strong id="urgentCount">0</strong><div class="accent">需要優先關注</div></div><div class="stat"><div class="mini">完成率</div><strong id="rate">0%</strong><div class="progress"><div id="bar" style="width:0%"></div></div></div></section><section class="content"><div class="section-head"><div><h2 id="sectionTitle">我的任務</h2><p id="sectionSubtitle">管理優先順序，讓每天更有效率</p></div></div><div class="tools"><input id="search" placeholder="⌕ 搜尋任務名稱或備註..." aria-label="搜尋任務"><select id="category" aria-label="分類篩選"><option value="all">全部分類</option><option>工作</option><option>學校</option><option>生活</option><option>個人</option></select><select id="priority" aria-label="優先程度篩選"><option value="all">所有優先級</option><option value="urgent">緊急</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select><select id="sort" aria-label="排序"><option value="priority">優先程度排序</option><option value="date">截止日期排序</option><option value="newest">最新建立排序</option></select></div><div class="tabs" id="tabs"><button data-tab="all" class="active">全部</button><button data-tab="active">未完成</button><button data-tab="done">已完成</button></div><div id="taskList" aria-live="polite"></div><div class="footer"><button class="btn" id="export">↓ 匯出備份 JSON</button><button class="btn" id="import">↑ 匯入備份</button><input type="file" id="file" accept=".json,application/json" hidden><button class="btn" id="demo">加入示範資料</button></div></section></main></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><form class="dialog" id="taskForm"><h2 id="dialogTitle">建立新任務</h2><label class="field">任務名稱<input id="title" maxlength="120" required placeholder="例如：完成期末報告"></label><label class="field">詳細備註<textarea id="description" maxlength="1000" placeholder="補充任務內容（選填）"></textarea></label><div class="two"><label class="field">緊急程度<select id="formPriority"><option value="medium">一般・中</option><option value="urgent">⚑ 緊急</option><option value="high">高</option><option value="low">低</option></select></label><label class="field">任務分類<select id="formCategory"><option>工作</option><option>學校</option><option>生活</option><option>個人</option></select></label></div><label class="field">截止日期<input type="date" id="due"></label><label class="field">子任務（每行一項）<textarea id="subtaskInput" placeholder="蒐集資料&#10;撰寫內容&#10;檢查並繳交"></textarea></label><div class="dialog-actions"><button class="btn" type="button" id="cancel">取消</button><button class="btn primary" type="submit">儲存任務</button></div></form></div><script>
'use strict';const KEY='focusflow-tasks-v2',OLD='codex-todo-v1',P={urgent:4,high:3,medium:2,low:1},PN={urgent:'緊急',high:'高優先',medium:'一般',low:'低優先'},$=id=>document.getElementById(id);const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const dateToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const clean=(a)=>Array.isArray(a)?a.filter(x=>x&&typeof x.text==='string').slice(0,5000).map(x=>({id:String(x.id||uid()),text:x.text.slice(0,120),description:String(x.description||'').slice(0,1000),done:!!x.done,priority:P[x.priority]?x.priority:'medium',category:['工作','學校','生活','個人'].includes(x.category)?x.category:'個人',due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||'')?x.due:'',created:Number(x.created)||Date.now(),subtasks:Array.isArray(x.subtasks)?x.subtasks.filter(s=>s&&typeof s.text==='string').slice(0,30).map(s=>({id:String(s.id||uid()),text:s.text.slice(0,120),done:!!s.done})):[]})):[];let tasks=[];try{const raw=localStorage.getItem(KEY);tasks=clean(JSON.parse(raw||localStorage.getItem(OLD)||'[]'))}catch{}let view='all',tab='all',editing=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{alert('瀏覽器儲存空間不足，請先匯出備份。')}};const node=(tag,cls,txt)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el};function render(){const total=tasks.length,done=tasks.filter(x=>x.done).length,pending=total-done,urgent=tasks.filter(x=>!x.done&&x.priority==='urgent').length,rate=total?Math.round(done/total*100):0;$('total').textContent=total;$('pending').textContent=pending;$('urgentCount').textContent=urgent;$('rate').textContent=rate+'%';$('bar').style.width=rate+'%';const titles={all:'我的任務',today:'今日到期',urgent:'緊急事項',upcoming:'未來計畫',done:'已完成的任務'};$('sectionTitle').textContent=titles[view];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const q=$('search').value.trim().toLocaleLowerCase(),today=dateToday();let list=tasks.filter(x=>{if(view==='today'&&(x.due!==today||x.done))return false;if(view==='urgent'&&(x.priority!=='urgent'||x.done))return false;if(view==='upcoming'&&(x.due<=today||x.done))return false;if(view==='done'&&!x.done)return false;if(tab==='active'&&x.done||tab==='done'&&!x.done)return false;if($('category').value!=='all'&&x.category!==$('category').value)return false;if($('priority').value!=='all'&&x.priority!==$('priority').value)return false;return (x.text+' '+x.description).toLocaleLowerCase().includes(q)});const sort=$('sort').value;list.sort((a,b)=>sort==='newest'?b.created-a.created:sort==='date'?(a.due||'9999').localeCompare(b.due||'9999'):Number(a.done)-Number(b.done)||P[b.priority]-P[a.priority]||(a.due||'9999').localeCompare(b.due||'9999'));const root=$('taskList');root.replaceChildren();if(!list.length){const e=node('div','empty');e.append(node('div','', '✦'),node('b','', '這裡還沒有符合條件的任務'),node('span','', '按右上角「建立任務」，開始安排你的計畫。'));root.append(e);return}list.forEach(x=>{const row=node('article','task'+(x.done?' done':''));const check=node('input','check');check.type='checkbox';check.checked=x.done;check.setAttribute('aria-label','完成 '+x.text);check.onchange=()=>{x.done=check.checked;save();render()};const body=node('div');body.append(node('div','task-title',x.text));if(x.description)body.append(node('div','desc',x.description));const meta=node('div','meta');const p=node('span','pill p-'+x.priority,PN[x.priority]);meta.append(p,node('span','pill',x.category));if(x.due){const overdue=!x.done&&x.due<today;meta.append(node('span','pill'+(overdue?' overdue':''),(overdue?'已逾期 · ':'截止 · ')+x.due))}body.append(meta);if(x.subtasks.length){const sub=node('div','subtasks');sub.append(node('div','desc','子任務 '+x.subtasks.filter(s=>s.done).length+'/'+x.subtasks.length));x.subtasks.forEach(s=>{const label=node('label');const c=node('input');c.type='checkbox';c.checked=s.done;c.onchange=()=>{s.done=c.checked;save();render()};label.append(c,node('span','',s.text));sub.append(label)});body.append(sub)}const actions=node('div','task-actions');const edit=node('button','iconbtn','✎');edit.title='編輯';edit.setAttribute('aria-label','編輯 '+x.text);edit.onclick=()=>openModal(x);const del=node('button','iconbtn','✕');del.title='刪除';del.setAttribute('aria-label','刪除 '+x.text);del.onclick=()=>{if(confirm('確定刪除「'+x.text+'」？')){tasks=tasks.filter(t=>t.id!==x.id);save();render()}};actions.append(edit,del);row.append(check,body,actions);root.append(row)})}function openModal(x=null){editing=x?.id||null;$('dialogTitle').textContent=x?'編輯任務':'建立新任務';$('taskForm').reset();$('title').value=x?.text||'';$('description').value=x?.description||'';$('formPriority').value=x?.priority||'medium';$('formCategory').value=x?.category||'工作';$('due').value=x?.due||'';$('subtaskInput').value=x?.subtasks.map(s=>s.text).join('\n')||'';$('modal').classList.add('open');$('title').focus()}function closeModal(){$('modal').classList.remove('open')} $('newTask').onclick=()=>openModal();$('cancel').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const old=tasks.find(x=>x.id===editing);const lines=$('subtaskInput').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);const subtasks=lines.map((text,i)=>{const prev=old?.subtasks.find(s=>s.text===text);return {id:prev?.id||uid(),text:text.slice(0,120),done:prev?.done||false}});const data={text:title.slice(0,120),description:$('description').value.trim(),priority:$('formPriority').value,category:$('formCategory').value,due:$('due').value,subtasks};if(old)Object.assign(old,data);else tasks.unshift({id:uid(),done:false,created:Date.now(),...data});save();closeModal();render()};$('search').oninput=render;['category','priority','sort'].forEach(id=>$(id).onchange=render);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;tab='all';render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'FocusFlow',version:2,exported:new Date().toISOString(),tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='FocusFlow-備份-'+dateToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){alert('檔案過大');return}try{const json=JSON.parse(await f.text());if(!Array.isArray(json.tasks)&&!Array.isArray(json))throw Error('格式不正確');const next=clean(Array.isArray(json)?json:json.tasks);if(confirm('匯入 '+next.length+' 筆任務？這會取代目前資料，請先備份。')){tasks=next;save();render()}}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};$('demo').onclick=()=>{if(tasks.length&&!confirm('要新增三筆示範任務嗎？'))return;const samples=[{text:'完成 Codex 課程作業',description:'整理 Word 報告並截圖',priority:'urgent',category:'學校',due:dateToday(),subtasks:[{id:uid(),text:'完成程式',done:true},{id:uid(),text:'整理截圖',done:false}]},{text:'整理本週工作進度',description:'確認本週待辦事項',priority:'high',category:'工作',due:'',subtasks:[]},{text:'安排週末運動',description:'至少運動 30 分鐘',priority:'low',category:'生活',due:'',subtasks:[]}];tasks.unshift(...samples.map(x=>({id:uid(),done:false,created:Date.now(),...x})));save();render()};$('greeting').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(new Date())+' · 把重要的事，安排得井然有序。';render();
</script><script>
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5e6){alert('檔案過大');e.target.value='';return}try{const json=JSON.parse(await f.text());if(!Array.isArray(json.tasks)&&!Array.isArray(json))throw Error('格式不正確');const imported=clean(Array.isArray(json)?json:json.tasks),merged=new Map(tasks.map(task=>[task.id,task]));imported.forEach(task=>merged.set(task.id,task));if(confirm('匯入 '+imported.length+' 筆任務並合併？同 ID 任務會以備份版本更新。')){tasks=[...merged.values()];save();render()}}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};
</script></body></html>
