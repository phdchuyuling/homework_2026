<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="洪瑋寧的 BMI 計算程式作業">
  <title>BMI 計算程式｜洪瑋寧</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18283b;
      --muted: #66768a;
      --blue: #3159d9;
      --blue-dark: #2445b6;
      --line: #dce4ef;
      --surface: #ffffff;
      --bg: #f2f6fc;
      --error: #a12b34;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 8%, rgba(92, 132, 255, .13), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(94, 193, 177, .12), transparent 30%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    }
    .card {
      width: min(100%, 480px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid rgba(220, 228, 239, .9);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 22px 70px rgba(26, 48, 85, .12);
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .12em;
    }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 2.65rem); letter-spacing: -.04em; }
    .intro { margin: 10px 0 28px; color: var(--muted); line-height: 1.7; }
    .field { margin: 18px 0; }
    label { display: block; margin-bottom: 8px; font-weight: 700; }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      min-height: 54px;
      padding: 12px 64px 12px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcff;
      color: var(--ink);
      font: inherit;
      font-size: 1.05rem;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(49, 89, 217, .12); }
    .unit { position: absolute; right: 15px; top: 50%; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
    .actions { display: flex; gap: 10px; margin-top: 24px; }
    button {
      min-height: 50px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .primary { flex: 1; background: var(--blue); color: white; transition: background .18s, transform .18s; }
    .primary:hover { background: var(--blue-dark); }
    .primary:active { transform: translateY(1px); }
    .secondary { padding: 0 18px; background: #edf1f8; color: #33445c; }
    .result {
      display: none;
      margin-top: 22px;
      padding: 18px 20px;
      border: 1px solid #d9e3ff;
      border-radius: 14px;
      background: #f4f7ff;
    }
    .result.visible { display: block; }
    .result-label { margin: 0 0 4px; color: var(--muted); font-size: .9rem; }
    .result-value { margin: 0; color: var(--blue-dark); font-size: 2rem; font-weight: 850; letter-spacing: -.03em; }
    .message { min-height: 1.4em; margin: 10px 0 0; color: var(--error); font-size: .92rem; }
    .formula { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; line-height: 1.7; }
    .student { margin: 18px 0 0; color: var(--muted); text-align: center; font-size: .82rem; }
    @media (max-width: 380px) {
      .actions { flex-direction: column; }
      .secondary { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">BMI CALCULATOR</p>
    <h1>BMI 計算程式</h1>
    <p class="intro">輸入身高與體重，計算您的身體質量指數。</p>

    <form id="bmi-form" novalidate>
      <div class="field">
        <label for="height">身高</label>
        <div class="input-wrap">
          <input id="height" name="height" type="number" inputmode="decimal" min="0.1" step="any" placeholder="例如：165" required>
          <span class="unit">公分</span>
        </div>
      </div>
      <div class="field">
        <label for="weight">體重</label>
        <div class="input-wrap">
          <input id="weight" name="weight" type="number" inputmode="decimal" min="0.1" step="any" placeholder="例如：55" required>
          <span class="unit">公斤</span>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit">計算 BMI</button>
        <button class="secondary" type="reset">清除</button>
      </div>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
      <section id="result" class="result" aria-live="polite" aria-atomic="true">
        <p class="result-label">您的 BMI</p>
        <p id="bmi-value" class="result-value">—</p>
      </section>
    </form>

    <p class="formula">計算公式：BMI = 體重（公斤）÷ 身高（公尺）²</p>
    <p class="student">洪瑋寧　｜　學號 611411027</p>
  </main>
  <script>
    const form = document.querySelector("#bmi-form");
    const heightInput = document.querySelector("#height");
    const weightInput = document.querySelector("#weight");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const bmiValue = document.querySelector("#bmi-value");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const heightCm = Number(heightInput.value);
      const weightKg = Number(weightInput.value);
      if (!Number.isFinite(heightCm) || !Number.isFinite(weightKg) || heightCm <= 0 || weightKg <= 0) {
        message.textContent = "請輸入大於 0 的身高與體重數值。";
        result.classList.remove("visible");
        return;
      }
      const heightM = heightCm / 100;
      bmiValue.textContent = (weightKg / (heightM ** 2)).toFixed(2);
      message.textContent = "";
      result.classList.add("visible");
    });

    form.addEventListener("reset", () => {
      message.textContent = "";
      result.classList.remove("visible");
      bmiValue.textContent = "—";
    });
  </script>
</body>
</html>
