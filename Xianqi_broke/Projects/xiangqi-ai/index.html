<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>象棋 AI 對弈</title><link rel="stylesheet" href="css/style.css"></head><body><header><div><small>BROWSER XIANGQI</small><h1>中國象棋 <span>AI 對弈</span></h1></div><div><button id="new">新局</button><button id="undo">悔棋</button><button id="flip">翻轉棋盤</button></div></header><main><section class="game"><div class="status"><b id="turn">紅方走棋</b><span id="msg">選擇棋子開始</span></div><div id="board" class="board"></div><p class="legend">紅方：玩家　｜　黑方：電腦 AI</p></section><aside><section><h2>對弈設定</h2><label>玩家執棋 <select id="side"><option value="r">紅方（先手）</option><option value="b">黑方（後手）</option></select></label><label>AI 強度 <select id="depth"><option value="1">快速</option><option value="2" selected>一般</option><option value="3">較強</option></select></label><button id="save">保存棋局</button><button id="load">載入棋局</button></section><section><h2>棋譜紀錄 <small id="count"></small></h2><div id="moves" class="moves">尚未開始</div><button id="prev">上一步</button><button id="next">下一步</button><button id="live">回到最新</button></section><section><h2>快速復盤</h2><p id="review">對局結束後可查看簡易復盤。</p><button id="analyze" disabled>分析本局</button></section><section><h2>操作說明</h2><p>點選己方棋子，再點綠色標記位置。黑方由 AI 自動應戰。棋譜自動保存於本機瀏覽器；可回看舊步數並從該處建立新分支。</p></section></aside></main><footer>離線瀏覽器遊戲，不需安裝額外套件</footer><script src="js/engine.js"></script><script src="js/main.js"></script></body></html>
